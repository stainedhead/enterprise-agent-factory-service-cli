<svg xmlns="http://www.w3.org/2000/svg" width="980" height="266" viewBox="0 0 980 266" role="img" aria-label="Secret values never go on the command line"><title>Secret values never go on the command line</title><rect width="980" height="266" rx="10" fill="#0d1117"/><rect width="980" height="34" rx="10" fill="#21262d"/><rect y="24" width="980" height="10" fill="#21262d"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/><text x="490" y="22" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Secret values never go on the command line</text><g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" style="white-space:pre" xml:space="preserve"><text x="22" y="62" style="white-space:pre" fill="#7ee787" font-weight="700">$ afs secrets create-secret --team-id team_01JD2Q3R4S5T6V7W8X9Y0Z0001 --name github-pat --scope team --secret-value</text><text x="22" y="81" style="white-space:pre" fill="#7ee787" font-weight="700">    hunter2 --endpoint-url https://afs.example.com</text><text x="22" y="100" style="white-space:pre" fill="#e6edf3" >usage: afs secrets create-secret [options]</text><text x="22" y="119" style="white-space:pre" fill="#e6edf3" ></text><text x="22" y="138" style="white-space:pre" fill="#e6edf3" >To see help text, run: afs secrets create-secret help</text><text x="22" y="157" style="white-space:pre" fill="#e6edf3" ></text><text x="22" y="176" style="white-space:pre" fill="#e6edf3" >afs: error: argument --secret-value: a secret value must not be passed as an argument: use file://PATH, fileb://PATH</text><text x="22" y="195" style="white-space:pre" fill="#e6edf3" >    or - (standard input)</text><text x="22" y="214" style="white-space:pre" fill="#7ee787" font-weight="700">$ echo $?</text><text x="22" y="233" style="white-space:pre" fill="#e6edf3" >252</text></g></svg>
