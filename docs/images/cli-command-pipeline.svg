sans-serif" font-size="13" font-weight="700" fill="#0972d3" letter-spacing="0.6">RUN TIME: AFS AGENTS UPDATE-AGENT --TEAM-ID … --MODEL …</text></g><polyline points="320,191 350,191 350,182.5 380,182.5" fill="none" stroke="#1d8102" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-data)" /><polyline points="650,182.5 680,182.5 680,191 710,191" fill="none" stroke="#5f6b7a" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-neutral)" /><polyline points="1000,191 1030,191 1030,182.5 1060,182.5" fill="none" stroke="#5f6b7a" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-neutral)" /><polyline points="241,386 267,386" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><polyline points="463,386 489,386" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><polyline points="685,386 711,386" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><polyline points="907,386 933,386" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><polyline points="1129,386 1155,386" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><polyline points="855,232 855,266 16,266 16,386 45,386" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-client)" /><g><rect x="50" y="150" width="270" height="82" rx="10" fill="#eef8ee" stroke="#1d8102" stroke-width="1.6"/><rect x="50" y="150" width="5" height="82" rx="2" fill="#1d8102" opacity="0.9"/><text x="185" y="179" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b3d00">api/openapi.yaml</text><text x="185" y="198" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">pinned snapshot + SOURCE</text><text x="185" y="215" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">(repo, commit, sha256)</text></g><g><rect x="380" y="150" width="270" height="65" rx="10" fill="#f6f7f8" stroke="#5f6b7a" stroke-width="1.6"/><rect x="380" y="150" width="5" height="65" rx="2" fill="#5f6b7a" opacity="0.9"/><text x="515" y="179" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#232f3e">tools/afsgen</text><text x="515" y="198" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">one descriptor per operation</text></g><g><rect x="710" y="150" width="290" height="82" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="710" y="150" width="5" height="82" rx="2" fill="#0972d3" opacity="0.9"/><text x="855" y="179" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">Registry</text><text x="855" y="198" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">internal/spec + per-service</text><text x="855" y="215" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">overrides, examples, columns</text></g><g><rect x="1060" y="150" width="290" height="65" rx="10" fill="#f6f7f8" stroke="#5f6b7a" stroke-width="1.6"/><rect x="1060" y="150" width="5" height="65" rx="2" fill="#5f6b7a" opacity="0.9"/><text x="1205" y="179" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#232f3e">tools/docgen</text><text x="1205" y="198" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">user-docs/reference, help</text></g><g><rect x="45" y="340" width="196" height="92" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="45" y="340" width="5" height="92" rx="2" fill="#0972d3" opacity="0.9"/><text x="143" y="374" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">Parse</text><text x="143" y="393" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">global options,</text><text x="143" y="410" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">profile, env, config</text></g><g><rect x="267" y="340" width="196" height="92" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="267" y="340" width="5" height="92" rx="2" fill="#0972d3" opacity="0.9"/><text x="365" y="374" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">Build</text><text x="365" y="393" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">flags +</text><text x="365" y="410" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">--cli-input-json</text></g><g><rect x="489" y="340" width="196" height="92" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="489" y="340" width="5" height="92" rx="2" fill="#0972d3" opacity="0.9"/><text x="587" y="374" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">Safe update</text><text x="587" y="393" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">read version,</text><text x="587" y="410" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">send If-Match</text></g><g><rect x="711" y="340" width="196" height="92" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="711" y="340" width="5" height="92" rx="2" fill="#0972d3" opacity="0.9"/><text x="809" y="374" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">Client</text><text x="809" y="393" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">credential chain,</text><text x="809" y="410" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">retries, idempotency</text></g><g><rect x="933" y="340" width="196" height="92" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="933" y="340" width="5" height="92" rx="2" fill="#0972d3" opacity="0.9"/><text x="1031" y="374" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">Paginate / wait</text><text x="1031" y="393" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">nextToken pages,</text><text x="1031" y="410" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">--wait polling</text></g><g><rect x="1155" y="340" width="196" height="92" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="1155" y="340" width="5" height="92" rx="2" fill="#0972d3" opacity="0.9"/><text x="1253" y="374" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">Render</text><text x="1253" y="393" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">json yaml table</text><text x="1253" y="410" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">text csv + --query</text></g><text x="45" y="470" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#414d5c">Credentials: AFS_API_KEY → ~/.afs/credentials → SSO token cache (0600) → workload token. Tokens and keys are redacted, even with --debug.</text><text x="45" y="487.5" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#414d5c">Exit codes follow the AWS CLI: 0 success, 252 usage, 254 service error (AccessDenied, …), 255 other. Secret values come only from a file, stdin or a prompt.</text><text x="1376" y="546" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8d99a8">Enterprise Agent Factory Service · cli-command-pipeline</text></svg>
