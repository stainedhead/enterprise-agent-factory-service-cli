<svg xmlns="http://www.w3.org/2000/svg" width="980" height="722" viewBox="0 0 980 722" role="img" aria-label="afs help"><title>afs help</title><rect width="980" height="722" rx="10" fill="#0d1117"/><rect width="980" height="34" rx="10" fill="#21262d"/><rect y="24" width="980" height="10" fill="#21262d"/><circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/><text x="490" y="22" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">afs help</text><g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" style="white-space:pre" xml:space="preserve"><text x="22" y="62" style="white-space:pre" fill="#7ee787" font-weight="700">$ afs --version</text><text x="22" y="81" style="white-space:pre" fill="#e6edf3" >afs-cli/dev contract/1.1 go1.27.4 linux/amd64</text><text x="22" y="100" style="white-space:pre" fill="#7ee787" font-weight="700">$ afs help</text><text x="22" y="119" style="white-space:pre" fill="#e6edf3" >AFS(1)</text><text x="22" y="138" style="white-space:pre" fill="#e6edf3" ></text><text x="22" y="157" style="white-space:pre" fill="#e6edf3" >NAME</text><text x="22" y="176" style="white-space:pre" fill="#e6edf3" >       afs - the Enterprise Agent Factory Service command line</text><text x="22" y="195" style="white-space:pre" fill="#e6edf3" ></text><text x="22" y="214" style="white-space:pre" fill="#e6edf3" >SYNOPSIS</text><text x="22" y="233" style="white-space:pre" fill="#e6edf3" >       afs [options] &lt;service&gt; &lt;operation&gt; [parameters]</text><text x="22" y="252" style="white-space:pre" fill="#e6edf3" ></text><text x="22" y="271" style="white-space:pre" fill="#e6edf3" >SERVICES</text><text x="22" y="290" style="white-space:pre" fill="#e6edf3" >       admin            Service administration: settings, templates, tags, channels, storage and security operators.</text><text x="22" y="309" style="white-space:pre" fill="#e6edf3" >       agents           Create and operate agents, their identities, configuration and external systems.</text><text x="22" y="328" style="white-space:pre" fill="#e6edf3" >       api-keys         Create and revoke API keys.</text><text x="22" y="347" style="white-space:pre" fill="#e6edf3" >       audit            Search and export the audit log.</text><text x="22" y="366" style="white-space:pre" fill="#e6edf3" >       budgets          Set budgets and read spend.</text><text x="22" y="385" style="white-space:pre" fill="#e6edf3" >       completion       Print a shell completion script.</text><text x="22" y="404" style="white-space:pre" fill="#e6edf3" >       configure        Create and edit profiles in ~/.afs/config.</text><text x="22" y="423" style="white-space:pre" fill="#e6edf3" >       members          Manage team members and role bindings.</text><text x="22" y="442" style="white-space:pre" fill="#e6edf3" >       models           List and manage models and their prices.</text><text x="22" y="461" style="white-space:pre" fill="#e6edf3" >       pools            Manage worker pools.</text><text x="22" y="480" style="white-space:pre" fill="#e6edf3" >       reports          Run and schedule reports.</text><text x="22" y="499" style="white-space:pre" fill="#e6edf3" >       secrets          Manage secret references and write secret values.</text><text x="22" y="518" style="white-space:pre" fill="#e6edf3" >       sso              Sign in with single sign-on and show who you are.</text><text x="22" y="537" style="white-space:pre" fill="#e6edf3" >       swarm-templates  Manage swarm templates.</text><text x="22" y="556" style="white-space:pre" fill="#e6edf3" >       teams            Create and manage teams.</text><text x="22" y="575" style="white-space:pre" fill="#e6edf3" >       work-orders      Manage work orders and their repositories.</text><text x="22" y="594" style="white-space:pre" fill="#e6edf3" ></text><text x="22" y="613" style="white-space:pre" fill="#e6edf3" >GLOBAL OPTIONS</text><text x="22" y="632" style="white-space:pre" fill="#e6edf3" >       --profile                Use a specific profile from ~/.afs/config.</text><text x="22" y="651" style="white-space:pre" fill="#e6edf3" >       --endpoint-url           Override the API endpoint URL.</text><text x="22" y="670" style="white-space:pre" fill="#e6edf3" >       --output                 Output format: json, yaml, table, text or csv.</text><text x="22" y="689" style="white-space:pre" fill="#e6edf3" >…</text></g></svg>
